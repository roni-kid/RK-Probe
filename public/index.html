<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RK Probe technical interview demo">
    <title>RK Probe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">AI technical interviewer</p>
        <h1>RK Probe</h1>
        <p class="intro">Choose a sample candidate and run a focused technical interview.</p>
      </header>

      <section class="start-panel" aria-labelledby="candidate-label">
        <label id="candidate-label" for="candidate-select">Demo candidate</label>
        <div class="start-controls">
          <select id="candidate-select" disabled>
            <option>Loading candidates…</option>
          </select>
          <button id="start-button" type="button" disabled>
            <span class="btn-label">Start interview</span>
          </button>
        </div>
      </section>

      <p id="error-message" class="error-message" role="alert" hidden></p>

      <div class="workspace">
        <aside class="side-panel candidate-panel" id="candidate-panel" aria-label="Candidate details" hidden>
          <div class="candidate-avatar" id="candidate-avatar" aria-hidden="true"></div>
          <h2 id="candidate-name" class="candidate-name">—</h2>
          <p id="candidate-role" class="candidate-role">—</p>
          <dl class="candidate-meta">
            <div>
              <dt>Experience</dt>
              <dd id="candidate-experience">—</dd>
            </div>
            <div>
              <dt>Education</dt>
              <dd id="candidate-education">—</dd>
            </div>
          </dl>
        </aside>

        <section class="chat-panel" aria-label="Interview conversation">
        <div class="chat-panel-header">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-text" class="status-text">Waiting to start</span>
        </div>
        <div id="messages" class="messages" aria-live="polite">
          <p class="empty-state">Select a candidate to begin.</p>
        </div>
        <div id="typing-indicator" class="typing-indicator" aria-live="polite" hidden>
          <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          RK Probe is thinking…
        </div>
        <form id="answer-form" class="answer-form" hidden>
          <label class="sr-only" for="answer-input">Your answer</label>
          <textarea id="answer-input" rows="3" placeholder="Type your answer, or hold the mic to speak…" required></textarea>
          <div class="answer-form-actions">
            <button
              id="mic-button"
              type="button"
              class="mic-button"
              aria-label="Hold to record your answer"
              aria-pressed="false"
              hidden
            >
              <svg class="mic-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19 11a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="send-button" type="submit">
              <span class="btn-label">Send</span>
            </button>
          </div>
        </form>
        <p id="voice-status" class="voice-status" aria-live="polite" hidden></p>
        </section>

        <aside class="side-panel progress-panel" id="progress-panel" aria-label="Interview progress" hidden>
          <h2 class="panel-heading">Progress</h2>
          <div class="progress-stat">
            <span class="progress-stat-value" id="questions-count">0</span>
            <span class="progress-stat-label">questions asked</span>
          </div>
          <div class="progress-bar-track" role="progressbar" aria-label="Curriculum days covered" aria-valuemin="0" id="days-progress-bar">
            <div class="progress-bar-fill" id="days-progress-fill"></div>
          </div>
          <p class="progress-caption" id="days-progress-caption">0 of 0 focus days covered</p>

          <h3 class="panel-subheading">Focus areas</h3>
          <ul class="focus-list" id="focus-list"></ul>
        </aside>
      </div>

      <section id="feedback" class="feedback" aria-live="polite" hidden></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
